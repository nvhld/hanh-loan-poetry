<!DOCTYPE html>
<html lang="vi">

<head>
  <script>
    if (window.location.protocol !== 'file:') {
      document.write('<base href="/">');
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='55' cy='45' r='6' fill='%23e4e4eb' opacity='0.3'/></svg>">
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='%23000'/><circle cx='135' cy='115' r='8' fill='%23111'/></svg>">
  <meta property="og:title" content="Hạnh Loan">
  <meta property="og:description" content="bởi vì em yêu anh...">
  <meta property="og:image" content="https://hanhloan.com/og-image.jpg">
  <title>Hạnh Loan — Thơ</title>
  <meta name="description" content="Một vũ trụ thơ ca. Bước vào nhẹ thôi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #050508;
      color: #dcdbe3;
      font-family: 'Playfair Display', serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── THRESHOLD ── */
    #threshold {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050508;
      /* dissolve: slow, like losing focus not like a fade-out */
      transition: opacity 3.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: default;
    }

    #threshold.dissolve {
      opacity: 0;
      pointer-events: none;
    }

    .t-line {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px, 2.8vw, 24px);
      color: rgba(220, 219, 227, 0);
      text-align: center;
      line-height: 1.95;
      max-width: 500px;
      padding: 0 40px;
      /* slow: eyes adjusting to dark, not a reveal animation */
      transition: color 5.0s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: 0.025em;
    }

    /* slightly lower max brightness — outdoor readable but not glaring */
    #threshold.ready .t-line {
      color: rgba(220, 219, 227, 0.78);
    }

    .t-prompt {
      font-family: 'Outfit', sans-serif;
      margin-top: 80px;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 5px;
      color: rgba(220, 219, 227, 0);
      text-transform: lowercase;
      /* delayed much longer — prompt only appears after poem has settled */
      transition: color 2.8s ease 4.2s;
      user-select: none;
    }

    #threshold.ready .t-prompt {
      color: rgba(220, 219, 227, 0.6); /* increased brightness */
    }

    /* ── DREAM LAYER ── */
    #dream {
      position: fixed;
      inset: 0;
      z-index: 10;
      opacity: 0;
      transition: opacity 2.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      touch-action: none;
    }

    #dream.visible {
      opacity: 1;
      pointer-events: auto;
    }

    canvas {
      display: block;
    }

    /* ── POEM VEIL ── */
    #poem-veil {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 5, 8, 0);
      pointer-events: none;
      transition: background 2.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #poem-veil.active {
      background: rgba(5, 5, 8, 0.32);
      pointer-events: auto;
      cursor: pointer;
    }

    #poem-text {
      position: fixed;
      inset: 0;
      z-index: 51;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* top-aligned with scroll: ensures whisper/cue always reachable */
      justify-content: flex-start;
      padding: 12dvh 40px 8dvh 40px;
      overflow-y: auto;
      scrollbar-width: none;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s, visibility 0s linear 2.1s;
    }
    #poem-text::-webkit-scrollbar { display: none; }

    #poem-text.visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s, visibility 0s linear 0s;
    }

    /* Radial backdrop: keeps text legible against cosmic background */
    #poem-text::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 72% 65% at 50% 50%,
          rgba(5, 5, 8, 0.68) 0%,
          rgba(5, 5, 8, 0.38) 55%,
          transparent 100%);
      pointer-events: none;
      z-index: -1;
    }

    body.minimal-mode #poem-text.visible {
      transition: opacity 0.5s ease 0s, visibility 0s linear 0s;
    }

    body.minimal-mode #poem-veil.active {
      transition: opacity 0.5s ease 0s, visibility 0s linear 0s;
    }

    .pt-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(10px, 1.4vw, 12px);
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(164, 132, 233, 0.82); /* brighter — was 0.55 */
      margin-bottom: 40px;
      text-align: left;
      width: 100%;
      max-width: 580px;
      margin-left: -4%;
      flex-shrink: 0;
    }

    .pt-body {
      font-family: 'Playfair Display', serif;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 2.2;
      color: rgba(255, 248, 204, 0.88);
      text-align: left;
      white-space: pre-wrap;
      width: 100%;
      max-width: 580px;
      margin-left: -4%;
      /* Reduce max-height to leave breathing room for whisper/cue below */
      max-height: 52dvh;
      overflow-y: auto;
      scrollbar-width: none;
      pointer-events: auto;
      user-select: text;
      flex-shrink: 1;
      /* Fade text smoothly when scrolling */
      padding-top: 32px;
      padding-bottom: 32px;
      margin-top: -32px;
      margin-bottom: 0; /* removed -32px so whisper has space */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 32px, black calc(100% - 32px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 32px, black calc(100% - 32px), transparent 100%);
    }

    .pt-body::-webkit-scrollbar {
      display: none;
    }

    /* ── COSMIC RAY — scroll indicator ── */
    #scroll-ray {
      position: fixed;
      right: 0;
      top: 0;
      width: 1px;
      z-index: 52;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent, rgba(255, 248, 204, 0.45), transparent);
      opacity: 0;
      transform-origin: top center;
      transition: opacity 0.12s ease;
    }

    .pt-controls {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-top: 40px;
      margin-bottom: 24px;
      flex-shrink: 0;
      width: 100%;
      max-width: 580px;
      margin-left: -4%;
    }

    .pt-exit {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 5px;
      color: rgba(220, 219, 227, 0.16);
      text-transform: lowercase;
      transition: color 0.5s;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
    }

    .pt-exit:hover {
      color: rgba(220, 219, 227, 0.42);
    }

    /* ── TOOLTIP whisper ── */
    #tip {
      position: fixed;
      pointer-events: none;
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-style: normal;
      color: rgba(220, 219, 227, 0.38);
      z-index: 200;
      transition: opacity 0.6s ease;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      text-transform: lowercase;
      letter-spacing: 3px;
      white-space: nowrap;
      opacity: 0;
    }

    #tip.visible {
      opacity: 1;
    }

    /* ── MOBILE ── */
    @media (max-width: 640px) {

      /* larger for outdoor readability */
      .t-line {
        font-size: 20px;
        line-height: 2.0;
      }

      .t-prompt {
        font-size: 11px;
        letter-spacing: 4px;
      }

      #poem-text {
        padding: 12dvh 24px 4dvh 24px; /* tighter sides on mobile */
        justify-content: flex-start; /* top-aligned on mobile = more room */
        padding-top: 14dvh;
      }

      .pt-title,
      .pt-body,
      .pt-controls {
        margin-left: 0;
      }

      .pt-body {
        font-size: 18px;
        line-height: 2.05;
        max-height: 48dvh; /* shorter to leave room for whisper */
      }

      #resonance-cue,
      #whisper-note {
        margin-left: 0;
        font-size: 11px;
        letter-spacing: 1.5px;
      }

      .pt-title {
        font-size: 10px;
        margin-bottom: 28px;
      }

      .pt-exit {
        margin-top: 32px;
        font-size: 10px;
        letter-spacing: 4px;
      }

      #surface-exit {
        bottom: 20px;
        right: 20px;
        font-size: 10px;
      }

      /* minimum tap target 44px */
      .pt-exit {
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    #btn-archive {
      position: fixed;
      top: 36px;
      right: 40px;
      z-index: 100;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(220, 219, 227, 0.38);
      text-decoration: none;
      text-transform: lowercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.4s ease, color 0.3s;
    }

    #dream.visible~#btn-archive {
      opacity: 1;
      pointer-events: auto;
    }

    #poem-veil.active~#btn-archive {
      opacity: 0;
      pointer-events: none;
    }

    #btn-archive:hover {
      color: rgba(220, 219, 227, 0.7);
    }

    @media (max-width: 640px) {
      #btn-archive {
        top: 24px;
        right: 24px;
        font-size: 10px;
      }
    }

    /* hide surface-exit — readers không truy cập curator */
    #surface-exit {
      display: none !important;
    }

    /* ── SOUND TOGGLE ── */
    #btn-sound {
      position: fixed;
      bottom: 36px;
      right: 40px;
      z-index: 100;
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(220, 219, 227, 0.22);
      text-transform: lowercase;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.4s ease, color 0.3s;
      user-select: none;
    }

    #dream.visible~#btn-sound {
      opacity: 1;
      pointer-events: auto;
    }

    #poem-veil.active~#btn-sound {
      opacity: 0;
      pointer-events: none;
    }

    #btn-sound:hover {
      color: rgba(220, 219, 227, 0.5);
    }

    #btn-sound.sound-on {
      color: rgba(164, 132, 233, 0.45);
    }

    @media (max-width: 640px) {
      #btn-sound {
        bottom: 20px;
        right: 20px;
        font-size: 9px;
      }
    }

    /* ── LENS LAYER (CRITICAL CONSTELLATION) ── */
    @keyframes lens-breathe {

      0%,
      100% {
        opacity: 0.62;
        transform: scale(1);
      }

      50% {
        opacity: 0.88;
        transform: scale(1.08);
      }
    }

    #btn-lens {
      display: none;
      position: fixed;
      /*
       * Left-align with poem text column:
       * Content is centred in viewport with max-width 580px.
       * Left edge = max(40px,  50vw - 290px)
       * We use 40px on mobile (padding) and calc() on wider screens.
       */
      top: clamp(28px, 4dvh, 52px);
      left: max(40px, calc(50vw - 290px));
      z-index: 100;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      margin: -8px;
      color: rgba(164, 132, 233, 0.62);
      animation: lens-breathe 4s ease-in-out infinite;
      transition: color 0.5s ease;
      user-select: none;
    }

    #btn-lens svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    body.has-lens #btn-lens {
      display: flex;
      pointer-events: auto;
    }

    /* Lens ON: stop breathing, go solid */
    body.lens-on #btn-lens {
      color: rgba(164, 132, 233, 0.92);
      animation: none;
      opacity: 1;
    }

    #btn-lens:hover {
      color: rgba(164, 132, 233, 0.9);
      animation: none;
    }

    #resonance-cue {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-style: normal;
      letter-spacing: 2px;
      color: rgba(164, 132, 233, 0.78); /* brighter — was 0.5 */
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 1.5s ease, max-height 1.5s ease;
      width: 100%;
      max-width: 580px;
      text-align: left;
      margin-top: 28px; /* breathing room above cue */
      margin-bottom: 6px;
      margin-left: -4%;
      flex-shrink: 0;
    }

    body.lens-on #resonance-cue {
      opacity: 1;
      max-height: 80px;
    }

    #whisper-note {
      font-family: 'Outfit', sans-serif;
      font-size: 11px; /* slightly larger — was 10px */
      letter-spacing: 1.8px;
      font-weight: 400;
      font-style: normal;
      color: rgba(164, 132, 233, 0.85); /* brighter — was 0.65 */
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 1.5s ease, max-height 1.5s ease;
      width: 100%;
      max-width: 580px;
      text-align: left;
      margin-left: -4%;
      margin-top: 14px;
      line-height: 1.9;
      flex-shrink: 0;
    }

    /* Whisper requires BOTH lens-on AND earned state */
    body.lens-on.whisper-earned #whisper-note {
      opacity: 1;
      max-height: 240px; /* enough for longest note */
      margin-bottom: 20px;
      transition: opacity 2.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s,
        max-height 2.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── TRANSIT GHOST ── */
    #transit-ghost {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 49;
      /* below poem-text(51) so pt-controls stay clickable */
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: clamp(32px, 6dvh, 72px);
      opacity: 0;
      transition: opacity 3.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #transit-ghost.haunting {
      pointer-events: auto;
      opacity: 1;
    }

    #transit-phrase {
      font-family: 'Outfit', sans-serif;
      font-size: 9px;
      letter-spacing: 4px;
      color: rgba(220, 219, 227, 0.15);
      text-transform: lowercase;
      margin-bottom: 12px;
      transition: color 2.5s ease;
    }

    #transit-ghost.pressure #transit-phrase {
      color: rgba(220, 219, 227, 0.26);
    }

    #transit-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(14px, 2vw, 18px);
      color: rgba(220, 219, 227, 0);
      cursor: default;
      user-select: none;
      transition: color 2.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #transit-ghost.title-visible #transit-title {
      color: rgba(220, 219, 227, 0.48);
    }

    #transit-ghost.warmth #transit-title {
      color: rgba(220, 219, 227, 0.62);
      text-shadow: 0 0 18px rgba(220, 219, 227, 0.08);
    }

    /* Whisper memory: returning readers see lower opacity cap */
    body.whisper-heard-before.lens-on.whisper-earned #whisper-note {
      opacity: 0.55;
      /* subtler than first-time 1.0 */
    }

    .lens-motif {
      transition: opacity 1.5s ease, color 1.5s ease, border-bottom 1.5s ease;
    }

    body.lens-on .lens-motif {
      color: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(220, 219, 227, 0.15);
    }

    /* ── INSTRUMENT MODAL ── */
    #im-overlay {
      position: fixed;
      inset: 0;
      z-index: 9500;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 14vh;
      padding-left: 20px;
      padding-right: 20px;
      background: rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 900ms ease;
    }
    #im-overlay.im-visible {
      opacity: 1;
      pointer-events: auto;
    }
    #im-box {
      width: 100%;
      max-width: 480px;
      background: rgba(7, 7, 10, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 36px 40px 44px;
      pointer-events: auto;
    }
    .im-section {
      margin-bottom: 0;
    }
    .im-section + .im-section:nth-child(2) { margin-top: 24px; }
    .im-section + .im-section:nth-child(3) { margin-top: 38px; }
    .im-section + .im-section:nth-child(4) { margin-top: 31px; }
    .im-label {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(220, 219, 227, 1);
      opacity: 0.34;
      margin-bottom: 10px;
      display: block;
    }
    .im-body {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      line-height: 1.9;
      color: rgba(220, 219, 227, 1);
      opacity: 0.78;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .im-body li {
      padding-left: 12px;
      position: relative;
    }
    .im-body li::before {
      content: '·';
      position: absolute;
      left: 0;
      opacity: 0.38;
    }
    .im-empty { opacity: 0.28; font-style: italic; }
    @media (max-width: 640px) {
      #im-box { padding: 28px 24px 36px; }
      #im-overlay { padding-top: 10vh; }
    }

    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }

      #dream,
      #threshold,
      #poem-veil,
      #btn-archive,
      #scroll-ray,
      .pt-exit {
        display: none !important;
      }

      #poem-text {
        position: static !important;
        opacity: 1 !important;
        visibility: visible !important;
        padding: 0 !important;
        transform: none !important;
      }

      .pt-title {
        color: #000 !important;
        margin-bottom: 24px !important;
      }

      .pt-body {
        color: #000 !important;
        overflow: visible !important;
        max-height: none !important;
      }

      body::after {
        content: "hanhloan.com";
        display: block;
        margin-top: 40px;
        font-size: 10px;
        font-family: 'Outfit', sans-serif;
        color: #999;
      }
    }
  </style>
</head>

<body>

  <div id="threshold">
    <div class="t-line" id="t-line"></div>
    <div class="t-prompt">chạm vào hạnh loan</div>
  </div>

  <div id="dream">
    <canvas id="c"></canvas>
  </div>

  <div id="poem-veil" onclick="closePoem()"></div>
  <div id="poem-text">
    <button id="btn-lens" aria-label="quỹ đạo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path
          d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
      </svg>
    </button>
    <div id="resonance-cue"></div>
    <div class="pt-title" id="pt-title"></div>
    <div class="pt-body" id="pt-body"></div>
    <div id="whisper-note"></div>
    <div class="pt-controls">
      <div class="pt-exit" onclick="closePoem()">trở về</div>
    </div>
  </div>

  <div id="transit-ghost">
    <div id="transit-phrase"></div>
    <div id="transit-title"></div>
  </div>

  <div id="tip"></div>
  <div id="scroll-ray"></div>
  <a href="/archive" id="btn-archive" onclick="goToArchive(event)">sắc màu hạnh loan</a>

  <button id="btn-sound" aria-label="âm thanh">○ im lặng</button>

  <script src="pending-modal.js"></script>
  <script src="curator_data_inline.js"></script>
  <script src="critical_lens_inline.js"></script>
  <script src="anchor_mri_inline.js"></script>
  <script src="instrument_translator.js"></script>
  <script src="motif_clusters_inline.js"></script>
  <script>
    const isLocalFile = window.location.protocol === 'file:';

    // ── LENS LAYER (CRITICAL CONSTELLATION) ──
    let _criticalData = (typeof CRITICAL_LENS_DATA !== 'undefined') ? CRITICAL_LENS_DATA : { poem_notes: [], motif_notes: [], constellation_essays: [] };
    // Bug 5 fix: fetch fails with file:// protocol due to CORS. Guard with isLocalFile.
    if (!isLocalFile && typeof CRITICAL_LENS_DATA === 'undefined') {
      fetch('critical-lens.json').then(r => r.json()).then(d => _criticalData = d).catch(e => { });

    // Universe total time (seconds) — not just which poems opened
    let _universeTime = 0;
    try { _universeTime = parseFloat(localStorage.getItem('hl-universe-time-v1') || '0'); } catch (e) { }
    setInterval(() => {
      _universeTime += 1;
      try { localStorage.setItem('hl-universe-time-v1', _universeTime.toFixed(0)); } catch (e) { }
    }, 1000);
    // Inherited cluster weather from Archive
    let _inheritedWeather = null;
    const CLUSTER_WEATHER = {
      'mc-01': { speedMult: 0.80, dustAlphaMult: 0.88, silThreshDelta: +500 },
      'mc-02': { speedMult: 0.55, dustAlphaMult: 0.92, silThreshDelta: -800 },
      'mc-03': { speedMult: 0.70, dustAlphaMult: 1.15, silThreshDelta: -400 },
      'mc-04': { speedMult: 0.60, dustAlphaMult: 0.72, silThreshDelta: +1000 }
    };
    try {
      const ic = sessionStorage.getItem('hl-inherited-cluster');
      if (ic && CLUSTER_WEATHER[ic]) _inheritedWeather = CLUSTER_WEATHER[ic];
    } catch (e) { }
    // Motif clusters data
    const _motifClusters = (typeof MOTIF_CLUSTERS_DATA !== 'undefined')
      ? (MOTIF_CLUSTERS_DATA.motif_clusters || [])
      : [];
    // Drift field state
    let _driftIntent = 0;
    let _driftVelocity = 0;
    let _lastPoemAct = Date.now();
    let _hasDrifted = false;
    // ── COSMIC CURRENT — galactic wind direction rotates very slowly
    // All particles are subject to this background current.
    // Full rotation: ~10 minutes. User perceives it as the universe breathing.
    let _cosmosAngle = Math.random() * Math.PI * 2;
    let _cosmosDX = 0, _cosmosDY = 0;

    // ── DRAW FRAME ────────────────────────────────────────────────────────────
    let _lft = performance.now();
    function drawFrame(ctx, W, H) {
      const now = performance.now();
      const dt = Math.min(0.1, (now - _lft) / 1000); _lft = now;
      updateSilence(dt); updateSprings(dt);
      // Advance cosmic current — lens-on halves rotation speed
      const motionRate = _lensOn ? 0.0038 : 0.011;
      _cosmosAngle += dt * motionRate;
      // Apply inherited cluster weather at 22% weight
      const iw = _inheritedWeather;
      const baseWindScale = _lensOn ? 0.10 : 0.28;
      const windScale = iw ? baseWindScale * (1 + (iw.speedMult - 1) * 0.22) : baseWindScale;
      _cosmosDX = Math.cos(_cosmosAngle) * windScale;
      _cosmosDY = Math.sin(_cosmosAngle) * (windScale * 0.46);
      stepDust(); spawnDust();

      // ── DRIFT FIELD & LINGER ──
      if (poemOpen) {
        const el = document.getElementById('pt-body');
        const now2 = Date.now();
        const idleMs = now2 - _lastPoemAct;
        const t = now2 / 1000;

        // Reader Presence accumulation (max 2.5 mins idle to avoid AFK farming)
        if (idleMs < 150000) {
          if (selPoem) {
            const eff = getEff(selPoem).emotionalField || {};
            _sessionWeather.entropy += (eff.entropy || 0) * dt;
            _sessionWeather.longing += (eff.longing || 0) * dt;
            _sessionWeather.eros += (eff.eros || 0) * dt;
            _sessionWeather.memory += (eff.memory || 0) * dt;
            _sessionWeather.distance += (eff.distance || 0) * dt;
            _sessionWeather.ecstasy += (eff.ecstasy || 0) * dt;
          }
          _poemLinger += dt;
        }

        // \u2500\u2500 WHISPER GATE (Phase 6) \u2500\u2500
        if (!_whisperEarned && pNotes && pNotes.length > 0) {
          // Stanza presence: near a pause zone accelerates emergence by up to 4s
          const nearPause = el._pauseOffsets &&
            el._pauseOffsets.some(o => Math.abs(el.scrollTop - o) < (el._lineH || 38) * 1.8);
          const stanzaBonus = nearPause ? 4 : 0;
          // Whisper memory: returning readers earn it 6s faster and see dimmer, quicker version
          const prevHeard = MEM[selPoem.id] && MEM[selPoem.id].whisperHeard;
          const memoryBonus = prevHeard ? 6 : 0;
          // Skim penalty: raise gate for skimmers
          const skimPenalty = _skimCount >= 3 ? 12 : (_skimCount >= 2 ? 6 : 0);
          const effectiveGate = Math.max(8, 18 - stanzaBonus - memoryBonus + skimPenalty);

          if (_poemLinger >= effectiveGate) {
            _whisperEarned = true;
            document.body.classList.add('whisper-earned');
            // Record that user has heard this whisper
            if (selPoem && !prevHeard) {
              if (!MEM[selPoem.id]) MEM[selPoem.id] = { count: 0, linger: 0 };
              MEM[selPoem.id].whisperHeard = true;
              saveMemory();
            }
          }
        }

        // \u2500\u2500 TRANSIT ACTIVATION (Phase 6) \u2500\u2500
        if (!_transitActive && _poemLinger >= 24 && _skimCount < 2) {
          const bodyEl2 = document.getElementById('pt-body');
          const nearBottom = bodyEl2 &&
            (bodyEl2.scrollTop + bodyEl2.clientHeight >= bodyEl2.scrollHeight - 100);
          if (nearBottom) maybeActivateTransit();
        }

        // Warm-up: 9s lần đầu, 4.5s các lần sau (tốc độ đọc thơ bình thường)
        if (_driftIntent > 0.5) _hasDrifted = true;
        const warmupMs = _hasDrifted ? 4500 : 9000;
        const lineH = el._lineH || 38;

        if (idleMs > warmupMs) {
          // Tăng intent mềm khi idle đủ lâu
          _driftIntent = Math.min(1, _driftIntent + dt * 0.12);
        } else {
          // Mọi interaction: giảm intent dần dần, KHÔNG reset cứng
          _driftIntent = Math.max(0, _driftIntent - dt * 0.3);
        }

        // Sin rhythm: thở, không tick
        const breathe = Math.sin(t * 0.28) * 0.03;   // ±0.03 amplitude cực nhẹ
        const basePx = isMobile ? 0.14 : 0.22;        // mobile chậm hơn 35%
        const targetV = (basePx + breathe) * _driftIntent;

        // Soft interpolation: velocity không nhảy cứng
        _driftVelocity += (targetV - _driftVelocity) * Math.min(1, dt * 0.4);

        if (_driftVelocity > 0.003) {
          // Detect pause zone richness
          const inBlankZone = el._pauseOffsets &&
            el._pauseOffsets.some(o => Math.abs(el.scrollTop - o) < lineH * 0.8);
          const inShortLine = el._shortLineOffsets &&
            el._shortLineOffsets.some(o => Math.abs(el.scrollTop - o) < lineH * 1.2);

          let zoneMult = 1.0;
          if (inBlankZone) zoneMult = isMobile ? 0.08 : 0.12; // stanza break: gần đứng hẳn
          if (inShortLine) zoneMult = Math.min(zoneMult, 0.3);  // isolated line: linger

          // Accumulate sub-pixels to defeat browser integer truncation of scrollTop
          el._scrollAccum = (el._scrollAccum || 0) + _driftVelocity * zoneMult;
          if (el._scrollAccum >= 1) {
            const step = Math.floor(el._scrollAccum);
            el.scrollTop += step;
            el._scrollAccum -= step;
          }

          // Cosmic ray: flash if moving fast enough
          if (_driftVelocity * zoneMult > 0.05) {
            flashCosmicRay(el);
          }
        }
      }

      ctx.clearRect(0, 0, W, H);

      const sw = getSessionWeather();
      let bgAlpha = 0.12;
      if (sw.dominant === 'entropy' && sw.value > 30) {
        bgAlpha = Math.max(0.08, 0.12 - (sw.value - 30) * 0.0005);
      } else if (sw.dominant === 'longing' && sw.value > 30) {
        bgAlpha = Math.min(0.16, 0.12 + (sw.value - 30) * 0.0005);
      }
      const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.65);
      bg.addColorStop(0, `rgba(18,16,26,${bgAlpha.toFixed(3)})`); bg.addColorStop(1, 'rgba(5,5,8,0)');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      drawHaze(ctx, dt); drawDust(ctx);

      NP.forEach((n, i) => {
        if (!revealed.has(i)) return;
        const p = n.poem, s = SP[i];
        const eff = getEff(p);
        const gm = eff.gravityMass || 1;
        const col = nodeColor(p);
        const isSel = selPoem && selPoem.id === p.id;
        const isHov = hovIdx === i;
        const w = warmth(p);
        const sc = starClass(p);

        // ── STAR HIERARCHY ────────────────────────────────────────────────────
        // anchor: larger, stable, bright — gravitational presence
        // dying:  tiny, dim, barely visible — emotional residue
        // normal: standard
        let baseR, coreAlphaBase, haloScale;
        if (sc === 'anchor') {
          baseR = (isMobile ? 5 : 6.5) + gm * 2.6;
          coreAlphaBase = 0.72;
          haloScale = 1.8;
        } else if (sc === 'dying') {
          baseR = (isMobile ? 1.5 : 2) + gm * 0.8;
          coreAlphaBase = 0.10;
          haloScale = 0.4;
        } else {
          baseR = (isMobile ? 3.5 : 4.5) + gm * 1.8;
          coreAlphaBase = 0.38;
          haloScale = 1.0;
        }

        s.tSc = isSel ? 0 : (isHov ? 1.35 : 1.0);
        if (s.sc < 0.02 && s.tSc > 0) s.sc = 0.06;
        const op = s.op;
        if (op < 0.01) return;

        // ── TWINKLE VARIANCE — encodes aliveness, NOT decoration ──────────────
        // Each star has a unique phase from its id hash.
        // Anchor stars: slow stable pulse. Dying stars: erratic flicker.
        // Normal: gentle subtle variance.
        const hash = p.id.split('').reduce((a, b) => { a = ((a << 5) - a) + b.charCodeAt(0); return a & a; }, 0);
        const tPhase = (Math.abs(hash) % 1000) / 1000 * Math.PI * 2;
        let twinkle = 0;
        if (sc === 'anchor') {
          twinkle = Math.sin(_bph * 0.6 + tPhase) * 0.06; // very slow, stable
        } else if (sc === 'dying') {
          // erratic: two frequencies interfere → irregular flicker
          twinkle = (Math.sin(_bph * 2.3 + tPhase) * Math.sin(_bph * 3.7 + tPhase * 1.3)) * 0.22;
        } else {
          twinkle = Math.sin(_bph * 1.1 + tPhase) * 0.09;
        }

        // breathe (silence-driven, as before)
        let bp = 0;
        if (w > 0.1 || isHov) {
          const silF = Math.max(0, (_sil - 0.15) / 0.85);
          bp = Math.sin(_bph * 1.5 + tPhase) * silF * 0.4;
        }

        const cr = baseR * Math.max(0.01, s.sc) * (0.88 + w * 0.12) * (1 + twinkle);
        const nx = n.x + s.dx, ny = n.y + s.dy;
        const coreAlpha = (coreAlphaBase + w * (1 - coreAlphaBase)) * op * (1 + twinkle * 0.5);

        // ── HALO / GLOW ───────────────────────────────────────────────────────
        const haloA = (isHov ? 0.20 : (sc === 'anchor' ? 0.12 : sc === 'dying' ? 0.02 : 0.07) + w * 0.08)
          * op * haloScale * (1 - _sil * 0.35);
        if (haloA > 0.004) {
          const haloR = cr + (sc === 'anchor' ? 18 : sc === 'dying' ? 4 : 10) + w * 6 + bp;
          const gr = ctx.createRadialGradient(nx, ny, 0, nx, ny, haloR);
          gr.addColorStop(0, col + hexA(haloA));
          gr.addColorStop(1, col + '00');
          ctx.beginPath(); ctx.arc(nx, ny, haloR, 0, Math.PI * 2);
          ctx.fillStyle = gr; ctx.fill();
        }

        // ── CORE ──────────────────────────────────────────────────────────────
        ctx.beginPath(); ctx.arc(nx, ny, cr + bp, 0, Math.PI * 2);
        ctx.fillStyle = col + hexA(Math.min(1, coreAlpha));
        ctx.fill();
      });
    }

    // ── REVEAL NEIGHBOR — with hesitation ────────────────────────────────────
    // Debounce: hover must persist ~280ms before neighbor surfaces.
    // Creates natural hesitation — curiosity earns revelation.
    let _revealTimer = null;
    function revealNeighbor(idx) {
      if (revealed.size >= poems.length) return;
      clearTimeout(_revealTimer);
      _revealTimer = setTimeout(() => {
        if (hovIdx !== idx) return; // user moved away — no reveal
        const n = NP[idx];
        let best = null, bestD = Infinity;
        NP.forEach((m, j) => {
          if (revealed.has(j)) return;
          const d = Math.hypot(n.x - m.x, n.y - m.y);
          if (d < bestD) { bestD = d; best = j; }
        });
        const sw = getSessionWeather();
        let threshD = isMobile ? 160 : 240;
        if (sw.dominant === 'entropy' && sw.value > 30) threshD *= 0.9;

        if (best !== null && bestD < threshD) {
          revealed.add(best);
          SP[best].sc = 0.04; // start very small — emerge slowly
        }
      }, 280);
    }

    // ── TRANSIT — HAUNT, NOT NAVIGATE (Phase 6) ───────────────────────────────
    function maybeActivateTransit() {
      if (_transitActive || !selPoem) return;
      // Find this poem's cluster
      const myCluster = _motifClusters.find(c => c.poems.includes(selPoem.id));
      if (!myCluster) return;
      // Weighted sibling selection: cluster continuity + linger history + motif persistence
      const siblings = myCluster.poems.filter(id => id !== selPoem.id);
      if (!siblings.length) return;
      let best = null, bestScore = -1;
      siblings.forEach(id => {
        const p = poems.find(x => x.id === id);
        if (!p) return;
        const mem = MEM[id] || {};
        const lingerScore = Math.log(1 + (mem.linger || 0)) * 0.4;
        const freshBonus = (mem.count || 0) === 0 ? 0.3 : 0; // prefer unread
        const fieldMatch = getEff(p).dominantField === getEff(selPoem).dominantField ? 0.2 : 0;
        const score = lingerScore + freshBonus + fieldMatch + Math.random() * 0.1;
        if (score > bestScore) { bestScore = score; best = p; }
      });
      if (!best) return;
      _transitActive = true;
      _transitTarget = best;
      const ghost = document.getElementById('transit-ghost');
      const phraseEl = document.getElementById('transit-phrase');
      const titleEl = document.getElementById('transit-title');
      // Stage 0 (0s): faint residue phrase appears
      ghost.classList.add('haunting');
      phraseEl.textContent = 'vẫn còn đây';
      // Stage 1 (2s): pressure increases
      _transitTimers.push(setTimeout(() => { ghost.classList.add('pressure'); }, 2000));
      // Stage 2 (4.5s): title materializes
      _transitTimers.push(setTimeout(() => {
        titleEl.textContent = best.title;
        ghost.classList.add('title-visible');
        ghost.style.cursor = 'pointer';
        ghost.onclick = () => { if (_transitTarget) transitTo(_transitTarget); };
      }, 4500));
      // Stage 3 (6s): warmth spread
      _transitTimers.push(setTimeout(() => { ghost.classList.add('warmth'); }, 6000));
    }

    function transitTo(poem) {
      if (!poem) return;
      if (selPoem && _poemLinger > 0) recordLinger(selPoem.id, _poemLinger);
      // Pass cluster forward so Reader inherits atmospheric continuity
      const myCluster = _motifClusters.find(c => c.poems.includes(poem.id));
      if (myCluster) {
        try { sessionStorage.setItem('hl-inherited-cluster', myCluster.id); } catch (e) { }
        _inheritedWeather = CLUSTER_WEATHER[myCluster.id] || null;
      }
      // Dissolve current poem, open next — no full page reload
      const pt = document.getElementById('poem-text');
      pt.style.transition = 'opacity 1.5s ease';
      pt.style.opacity = '0';
      setTimeout(() => {
        pt.style.transition = '';
        pt.style.opacity = '';
        closePoem();
        openPoem(poem);
      }, 1600);
    }

    // ── POEM OPEN / CLOSE ─────────────────────────────────────────────────────
    function openPoem(p) {
      if (poemOpen) return;
      poemOpen = true; selPoem = p;
      const isReturn = readCount(p.id) > 0;
      recordRead(p.id); touch();
      playResonance(getEff(p).dominantField || 'entropy');

      // drift neighbors away — gently, not cinematically
      const sn = NP.find(n => n.poem.id === p.id);
      if (sn) {
        const driftForce = isMobile ? 14 : 21; // -30%
        NP.forEach((n, i) => {
          if (n.poem.id === p.id) return;
          const dx = n.x - sn.x, dy = n.y - sn.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 160) {
            const f = (160 - dist) / 160 * driftForce;
            const ang = Math.atan2(dy, dx);
            SP[i].tDx = Math.cos(ang) * f;
            SP[i].tDy = Math.sin(ang) * f;
          }
        });
        const si = NP.findIndex(n => n.poem.id === p.id);
        if (si >= 0) SP[si].tSc = 0;
      }

      // RETURN FEELING: if revisiting, warm nearby nodes + slow their silence
      if (isReturn && sn) {
        NP.forEach((n, i) => {
          if (n.poem.id === p.id) return;
          const dist = Math.hypot(n.x - sn.x, n.y - sn.y);
          if (dist < 200) {
            // ambient warmth: nearby poems remember this place was touched
            attn[n.poem.id] = (attn[n.poem.id] || 0) + 1.5;
          }
        });
        // Field silence delayed: universe remembers, doesn't rush to quiet
        _lastAct = Date.now() + 1500;
      }

      const titleEl = document.getElementById('pt-title');
      titleEl.textContent = p.title;
      titleEl.style.color = nodeColor(p) + 'a6'; // a6 = 65% opacity
      const bodyEl = document.getElementById('pt-body');

      resetLens();
      // Expose pNotes to drawFrame via module-level var
      pNotes = [];
      if (_criticalData && _criticalData.poem_notes) {
        pNotes = _criticalData.poem_notes.filter(n => n.poemId.includes(p.id));
      }
      const cueEl = document.getElementById('resonance-cue');
      const whisperEl = document.getElementById('whisper-note');
      // Bug 1 fix: escape poem text FIRST, then inject spans for motifs.
      // The raw text goes through HTML-escape before any regex substitution,
      // so textContent-based pause-offset calc in attachScrollResistance can
      // still read el.textContent (stripped of tags) correctly.
      const rawText = p.content || p.body || '';
      let textHTML = rawText.replace(/</g, '&lt;').replace(/>/g, '&gt;');

      if (pNotes.length > 0) {
        const note = pNotes[0];
        const dominantField = getEff(p).dominantField || 'entropy';
        cueEl.textContent = RESONANCE_PHRASES[dominantField] || RESONANCE_PHRASES.entropy;
        // Whisper memory: returning readers see subtler version
        const prevHeard = MEM[p.id] && MEM[p.id].whisperHeard;
        if (prevHeard) {
          document.body.classList.add('whisper-heard-before');
          whisperEl.style.removeProperty('--whisper-opacity-cap');
        } else {
          document.body.classList.remove('whisper-heard-before');
          whisperEl.style.removeProperty('--whisper-opacity-cap');
        }
        whisperEl.textContent = note.text;
        // Instrument Modal: attach click handler if anchor poem
        whisperEl.style.cursor = PendingModal.isAnchor(p.id) ? 'pointer' : '';
        whisperEl.onclick = PendingModal.isAnchor(p.id)
          ? () => InstrumentModal.open(p.id)
          : null;
        if (note.motif && note.motif.length > 0) {
          note.motif.forEach(m => {
            // Escape motif string before using in regex
            const escaped = m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            textHTML = textHTML.replace(regex, '<span class="lens-motif">$1</span>');
          });
        }
        // Show lens button immediately if poem has notes
        document.body.classList.add('has-lens');
      } else {
        cueEl.textContent = '';
        whisperEl.textContent = '';
      }
      bodyEl.innerHTML = textHTML;
      bodyEl.scrollTop = 0;
      attachScrollResistance(bodyEl);
      // Reset drift & linger for new poem session
      _poemLinger = 0;
      _driftIntent = 0;
      _driftVelocity = 0;
      _lastPoemAct = Date.now();
      _hasDrifted = false;
      // Phase 6 reset
      _whisperEarned = false;
      _skimCount = 0;
      _transitActive = false;
      _transitTarget = null;
      _transitTimers.forEach(t => clearTimeout(t)); _transitTimers = [];
      document.body.classList.remove('whisper-earned');
      const tg = document.getElementById('transit-ghost');
      if (tg) { tg.className = ''; document.getElementById('transit-phrase').textContent = ''; document.getElementById('transit-title').textContent = ''; }
      document.getElementById('poem-veil').classList.add('active');
      // no setTimeout trick — just let the CSS transitions do the timing
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.getElementById('poem-text').classList.add('visible');
        });
      });
    }

    function closePoem() {
      if (!poemOpen) return;
      if (selPoem && _poemLinger > 0) {
        recordLinger(selPoem.id, _poemLinger);
        _poemLinger = 0;
      }
      poemOpen = false;
      resetLens();
      // Phase 6 reset
      _whisperEarned = false;
      _skimCount = 0;
      _transitActive = false;
      _transitTarget = null;
      _transitTimers.forEach(t => clearTimeout(t)); _transitTimers = [];
      document.body.classList.remove('whisper-earned', 'whisper-heard-before');
      const tgC = document.getElementById('transit-ghost');
      if (tgC) { tgC.className = ''; tgC.onclick = null; tgC.style.cursor = ''; }

      if (document.referrer.includes('/archive')) {
        document.body.style.transition = 'opacity 1.5s ease';
        document.body.style.opacity = '0';
        setTimeout(() => {
          document.getElementById('poem-text').classList.remove('visible');
          document.getElementById('poem-veil').classList.remove('active');
          window.history.back();
        }, 1500);
        return;
      }

      document.getElementById('poem-text').classList.remove('visible');
      document.getElementById('poem-veil').classList.remove('active');
      SP.forEach(s => { s.tDx = 0; s.tDy = 0; });
      const si = selPoem ? NP.findIndex(n => n.poem.id === selPoem.id) : -1;
      if (si >= 0) SP[si].tSc = 1;
      selPoem = null;
      _driftIntent = 0; _driftVelocity = 0; _hasDrifted = false;
      touch();
    }

    // ── MOUSE / TOUCH ─────────────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const tip = document.getElementById('tip');

    function getNear(mx, my, thresh) {
      let best = null, bestD = thresh;
      NP.forEach((n, i) => {
        if (!revealed.has(i)) return;
        const s = SP[i];
        const nx = n.x + s.dx, ny = n.y + s.dy;
        const d = Math.hypot(nx - mx, ny - my);
        if (d < bestD) { bestD = d; best = i; }
      });
      return best;
    }

    canvas.addEventListener('mousemove', e => {
      touch();
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const found = getNear(mx, my, 20);
      if (found !== hovIdx) {
        hovIdx = found;
        if (found !== null) revealNeighbor(found);
        else clearTimeout(_revealTimer);
      }
      if (found !== null) {
        const p = NP[found].poem;
        startAttn(p.id);
        // tooltip fixed whisper label
        tip.classList.add('visible');
        tip.textContent = p.title;
        canvas.style.cursor = 'pointer';
      } else {
        tip.classList.remove('visible');
        stopAttn();
        canvas.style.cursor = 'default';
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hovIdx = null; tip.classList.remove('visible'); stopAttn();
    });

    canvas.addEventListener('click', e => {
      touch();
      const r = canvas.getBoundingClientRect();
      const found = getNear(e.clientX - r.left, e.clientY - r.top, 24);
      if (found !== null) openPoem(NP[found].poem);
    });

    // Touch support
    let touchRevealTimer = null;
    canvas.addEventListener('touchstart', e => {
      touch();
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      const found = getNear(t.clientX - r.left, t.clientY - r.top, 36);
      if (found !== null) {
        touchRevealTimer = setTimeout(() => {
          hovIdx = found;
          revealNeighbor(found);
          startAttn(NP[found].poem.id);
        }, 180);
      }
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      clearTimeout(touchRevealTimer);
      if (hovIdx !== null) { openPoem(NP[hovIdx].poem); hovIdx = null; stopAttn(); }
    }, { passive: true });

    // Keyboard exit
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closePoem();
    });

    // ── ANIMATE ───────────────────────────────────────────────────────────────
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      computePositions(canvas.width, canvas.height);
    }

    function animate() {
      const ctx = canvas.getContext('2d');
      drawFrame(ctx, canvas.width, canvas.height);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    animate();

    // ── THRESHOLD INIT ────────────────────────────────────────────────────────
    // Pick threshold line: first line of a poem that has text
    // Measure px-width of a string in the threshold font context
    function measureLineWidth(text) {
      const el = document.getElementById('t-line');
      const fs = parseFloat(getComputedStyle(el).fontSize) || 20;
      // canvas measurer
      const cv = document.createElement('canvas');
      const cx = cv.getContext('2d');
      cx.font = `${fs}px 'Playfair Display', serif`;
      return cx.measureText(text).width;
    }

    // Quote cooldown memory: track which pairs were recently shown
    let _quoteHistory = [];
    try {
      _quoteHistory = JSON.parse(localStorage.getItem('hanh-loan-quote-hist-v1') || '[]');
    } catch (e) { }

    function saveQuoteHistory() {
      try { localStorage.setItem('hanh-loan-quote-hist-v1', JSON.stringify(_quoteHistory.slice(-20))); } catch (e) { }
    }

    function getThresholdLine() {
      const withText = poems.filter(p => p.body && p.body.trim().length > 10);
      if (!withText.length) return { html: 'em không biết mình đang chờ gì.' };

      const maxW = window.innerWidth - 80;
      const COOLDOWN = 7; // sessions before a quote can recur

      const candidates = [];
      withText.forEach(p => {
        const lines = p.body.split('\n').map(l => l.trim());
        for (let i = 0; i < lines.length - 1; i++) {
          const l1 = lines[i], l2 = lines[i + 1];
          if (l1.length < 12 || l2.length < 12) continue;
          if (l1.toUpperCase() === l1 || l2.toUpperCase() === l2) continue;
          const blocked = ['tặng', 'cho', 'kính tặng', 'kính dâng'];
          if (blocked.some(b => l1.toLowerCase().startsWith(b) || l2.toLowerCase().startsWith(b))) continue;
          if (measureLineWidth(l1) > maxW || measureLineWidth(l2) > maxW) continue;

          const key = l1.slice(0, 16) + '|' + l2.slice(0, 16);
          const histPos = _quoteHistory.lastIndexOf(key);
          const recency = histPos < 0 ? 999 : (_quoteHistory.length - 1 - histPos);
          if (recency < COOLDOWN) continue;

          let weight = 1;
          if (i === 0 || lines[i - 1] === '') weight += 3;
          if (getEff(p).dominantField) weight += 2;
          if (weight >= 5 && recency > COOLDOWN + 2) weight += 2; // seasonal bonus
          candidates.push({ l1, l2, key, weight });
        }
      });
      if (!candidates.length) return { html: 'em không biết mình đang chờ gì.' };
      let totalW = candidates.reduce((s, c) => s + c.weight, 0);
      let r = Math.random() * totalW;
      for (const c of candidates) {
        r -= c.weight;
        if (r <= 0) { _quoteHistory.push(c.key); saveQuoteHistory(); return { html: c.l1 + '<br>' + c.l2 }; }
      }
      const fb = candidates[0];
      _quoteHistory.push(fb.key); saveQuoteHistory();
      return { html: fb.l1 + '<br>' + fb.l2 };
    }

    (function initThreshold() {
      let directId = null;
      const path = window.location.pathname;
      if (path.startsWith('/poem/')) {
        directId = path.split('/poem/')[1].replace(/\/$/, '');
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        directId = urlParams.get('id');
      }
      const _directPoemRaw = directId ? poems.find(p => p.id === directId) : null;
      const isBlockedDirect = _directPoemRaw && typeof PendingModal !== 'undefined' && !PendingModal.isAnchor(_directPoemRaw.id);
      
      const _directPoem = isBlockedDirect ? null : _directPoemRaw;
      const isDirect = !!_directPoem;
      const visitCount = (MEM['_system_visit_count'] || 0) + 1;
      
      if (!isDirect) {
        MEM['_system_visit_count'] = visitCount;
        saveMemory();
      }

      // MVP gate: non-anchor direct link shows pending modal, does NOT open poem
      if (isBlockedDirect) {
        // Show threshold screen, overlay modal after brief settle
        // User dismisses modal themselves — no redirect forced.
        setTimeout(() => {
          PendingModal.show(_directPoemRaw.id, _directPoemRaw.title, () => {
            if (visitCount > 1) {
              window.location.href = isLocalFile ? 'archive.html' : '/archive';
            }
          });
        }, 600);
      } else if (!isDirect && visitCount > 1) {
        window.location.href = isLocalFile ? 'archive.html' : '/archive';
        return;
      }

      window._isMinimalMode = isDirect || /FBAN|FBAV|Zalo/i.test(navigator.userAgent) || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (window._isMinimalMode) {
        document.body.classList.add('minimal-mode');
      }

      const th = document.getElementById('threshold');
      let entered = false;
      function enter(isDirectEnter = false) {
        if (entered) return;
        entered = true;
        if (isDirectEnter) {
          th.style.display = 'none';
        } else {
          th.classList.add('dissolve');
          setTimeout(() => { th.style.display = 'none'; }, window._isMinimalMode ? 500 : 4000);
        }
        document.getElementById('dream').classList.add('visible');
        document.getElementById('surface-exit').classList.add('visible');
        touch();
      }

      if (_directPoem) {
        enter(true);
        setTimeout(() => { openPoem(_directPoem); }, 50);
      } else {
        document.getElementById('t-line').innerHTML = getThresholdLine().html;
        setTimeout(() => th.classList.add('ready'), 800);
        th.addEventListener('click', () => enter());
        th.addEventListener('touchend', e => { e.preventDefault(); enter(); }, { passive: false });
        document.addEventListener('keydown', e => {
          if ((e.key === 'Enter' || e.key === ' ') && !entered) enter();
        });
      }
    })();


    function attachScrollResistance(el) {
      // Bug 1 fix: use el.innerText (or textContent) which strips HTML tags,
      // so pause-offset calculation is correct even when bodyEl uses innerHTML.
      const text = el.innerText || el.textContent || '';
      const lines = text.split('\n');
      const lineH = parseFloat(getComputedStyle(el).lineHeight) || 38;

      // Rich pause zones: blank lines + short/isolated lines
      const pauseOffsets = [];
      const shortLineOffsets = [];
      let cumH = 0;
      lines.forEach((line, idx) => {
        cumH += lineH;
        const trimmed = line.trim();
        if (trimmed === '') {
          pauseOffsets.push(cumH);
        } else if (trimmed.length > 0 && trimmed.length < 18) {
          const prevEmpty = idx === 0 || lines[idx - 1].trim() === '';
          const nextEmpty = idx === lines.length - 1 || lines[idx + 1].trim() === '';
          if (prevEmpty || nextEmpty) shortLineOffsets.push(cumH);
        }
      });

      el._pauseOffsets = pauseOffsets;
      el._shortLineOffsets = shortLineOffsets;
      el._lineH = lineH;

      function inPauseZone(scrollTop) {
        return pauseOffsets.some(o => Math.abs(scrollTop - o) < lineH * 0.8);
      }

      window.flashCosmicRay = function (elOrNull) {
        const targetEl = elOrNull || el;
        const ray = document.getElementById('scroll-ray');
        if (ray && targetEl.scrollHeight > targetEl.clientHeight) {
          const pct = targetEl.scrollTop / Math.max(1, targetEl.scrollHeight - targetEl.clientHeight);
          const h = targetEl.clientHeight * 0.14;
          ray.style.height = h + 'px';
          ray.style.top = (pct * (targetEl.clientHeight - h)) + 'px';
          ray.style.opacity = '0.4';
          clearTimeout(ray._t);
          ray._t = setTimeout(() => { ray.style.opacity = '0'; }, 90);
        }
      };

      // Wheel: resistance only. Damps drift 70%, doesn't kill.
      el.addEventListener('wheel', e => {
        _lastPoemAct = Date.now();
        _driftVelocity *= 0.3;
        // Skim detection: fast scroll early in reading
        if (Math.abs(e.deltaY) > 120 && _poemLinger < 15) _skimCount++;
        const resistance = inPauseZone(el.scrollTop) ? 0.72 : 0.82;
        e.preventDefault();
        el.scrollTop += e.deltaY * resistance;
        if (Math.abs(e.deltaY) > 5) { window.flashCosmicRay(el); playPressureShift(); }
      }, { passive: false });

      // Touch: mobile touch always wins drift, but softly
      el.addEventListener('touchstart', () => { _lastPoemAct = Date.now(); _driftVelocity *= 0.2; }, { passive: true });
      el.addEventListener('touchmove', () => {
        _lastPoemAct = Date.now();
        _driftVelocity = 0;
        window.flashCosmicRay(el);
      }, { passive: true });
    }

    document.addEventListener('keydown', () => {
      if (poemOpen) { _lastPoemAct = Date.now(); _driftVelocity *= 0.3; window.flashCosmicRay(document.getElementById('pt-body')); }
    });
  </script>

  <!-- Instrument Modal overlay (Lab Mode: 12 anchor poems only) -->
  <div id="im-overlay" role="dialog" aria-modal="true" aria-label="instrument layer">
    <div id="im-box"></div>
  </div>

  <script>
  // ── INSTRUMENT MODAL ─────────────────────────────────────────────────────
  (function () {
    'use strict';

    const isLocalFile = window.location.protocol === 'file:';
    let _mriCache = null;        // loaded once
    let _overlayEl = null;       // #im-overlay
    let _escHandler = null;

    function getOverlay() {
      return _overlayEl || (_overlayEl = document.getElementById('im-overlay'));
    }

    function buildHTML(blocks) {
      const sections = [
        { label: 'drift',    lines: blocks.drift },
        { label: 'pressure', lines: blocks.pressure },
        { label: 'absence',  lines: blocks.absence },
      ];
      return sections.map(s => {
        const items = s.lines.length
          ? s.lines.map(l => `<li>${l}</li>`).join('')
          : `<li class="im-empty">no signal detected</li>`;
        return `<div class="im-section">
  <span class="im-label">${s.label}</span>
  <ul class="im-body">${items}</ul>
</div>`;
      }).join('');
    }

    function dismiss() {
      const ov = getOverlay();
      if (!ov) return;
      ov.classList.remove('im-visible');
      if (_escHandler) { document.removeEventListener('keydown', _escHandler); _escHandler = null; }
      setTimeout(() => { ov.querySelector('#im-box').innerHTML = ''; }, 920);
    }

    function render(mriEntry) {
      const translator = window.InstrumentTranslator;
      if (!translator) return;
      const blocks = translator.translateMRI(mriEntry);
      const box = getOverlay().querySelector('#im-box');
      box.innerHTML = buildHTML(blocks);

      const ov = getOverlay();
      ov.classList.remove('im-visible');  // reset if already open
      requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('im-visible')));

      // Close: outside click
      ov.onclick = (e) => { if (!e.target.closest('#im-box')) dismiss(); };
      // Close: ESC
      _escHandler = (e) => { if (e.key === 'Escape') dismiss(); };
      document.addEventListener('keydown', _escHandler);
    }

    function open(poemId) {
      if (_mriCache) {
        render(_mriCache[poemId] || null);
        return;
      }
      
      const inline = typeof window !== 'undefined' ? window.ANCHOR_MRI_DATA : null;
      if (inline) {
        _mriCache = inline; 
        render(inline[poemId] || null);
        return;
      }
      
      if (isLocalFile) return; // Prevent CORS error locally
      fetch('anchor_mri.json')
        .then(r => r.json())
        .then(data => { _mriCache = data; render(data[poemId] || null); })
        .catch(() => {});
    }

    window.InstrumentModal = { open, dismiss };
  })();
  </script>
